name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build; unit, golden (scipy) and property tests; Kayenta differential test in Testcontainers
        run: ./gradlew build --no-daemon
      - name: Replay the recorded runs through every judge (exp1 to exp3, from the committed recordings)
        run: |
          ./gradlew --no-daemon -q :bench:installDist
          mkdir -p run
          bench/build/install/bench/bin/bench evaluate --trials results/trials.jsonl --out-dir run
          python3 bench/check_reproduce.py results run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            run/

  canary-gate:
    # The repository's own GitHub Action, gating on two recorded canaries: a healthy one must pass and one with a
    # 25% latency regression must fail the step.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Healthy canary (recorded A/A run)
        uses: ./
        with:
          config: configs/canary-config.json
          baseline: examples/healthy-baseline.csv
          canary: examples/healthy-canary.csv
      - name: Canary with a 25% latency regression (must be stopped)
        id: bad
        continue-on-error: true
        uses: ./
        with:
          config: configs/canary-config.json
          baseline: examples/regressed-baseline.csv
          canary: examples/regressed-canary.csv
      - name: Check the gate stopped the bad canary
        run: |
          echo "verdict: ${{ steps.bad.outputs.verdict }}"
          test "${{ steps.bad.outcome }}" = failure
          test "${{ steps.bad.outputs.verdict }}" = fail
